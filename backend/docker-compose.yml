version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: upi-saathi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: upi_saathi
    ports:
      - "5432:5432"
    volumes:
      - upi_saathi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d upi_saathi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  upi_saathi_pgdata: