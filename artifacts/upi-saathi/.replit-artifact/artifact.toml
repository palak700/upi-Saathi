kind = "web"
previewPath = "/"
title = "UPI Saathi"
description = "An accessibility-first AI payment guidance app for learning, checking, and safely simulating digital payments without moving real money."
version = "1.0.0"
id = "artifacts/upi-saathi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26028

[services.development]
run = "pnpm --filter @workspace/upi-saathi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/upi-saathi", "run", "build" ]
serve = "static"
publicDir = "artifacts/upi-saathi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26028"
BASE_PATH = "/"
